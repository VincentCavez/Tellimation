<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHIELD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css?v=13">
</head>
<body class="home-body">
  <div class="falling-pixels-bg" id="falling-pixels"></div>

  <div class="study-landing-container home-page">
    <header class="home-header">
      <h1 class="home-title" aria-label="SHIELD">
        <span class="c-red">S</span><span class="c-yellow">H</span><span class="c-blue">I</span><span class="c-teal">E</span><span class="c-red">L</span><span class="c-yellow">D</span>
      </h1>
      <p class="home-subtitle">
        <b class="c-red">S</b>torytelling <b class="c-yellow">H</b>elper for <b class="c-blue">I</b>nteractive
        and <b class="c-teal">E</b>xpressive <b class="c-red">L</b>iteracy <b class="c-yellow">D</b>evelopment
      </p>
    </header>

    <div class="study-block">
      <div class="home-block-title">Practice</div>
      <div class="thumbnail-row" id="training-thumbnails"></div>
    </div>

    <div class="study-block">
      <div class="home-block-title">Stories</div>
      <div class="thumbnail-row" id="story-thumbnails"></div>
    </div>

    <a class="btn btn-red home-download" id="btn-download" href="#" download>Download my analysis</a>
  </div>

  <script src="/static/engine.js?v=2"></script>
  <script src="/static/scene_picker.js?v=2"></script>
  <script src="/static/home.js?v=3"></script>
  <script>
    // Falling pixels animation in margins
    const colors = ['#DB0038', '#F7C200', '#519DD9', '#53BAC1', '#EDEDED'];
    const pixelsContainer = document.getElementById('falling-pixels');
    let activePixels = 0;
    const maxPixels = 8;

    function createPixel() {
      if (activePixels >= maxPixels) return;
      const pixel = document.createElement('div');
      pixel.className = 'falling-pixel';
      const color = colors[Math.floor(Math.random() * colors.length)];
      pixel.style.backgroundColor = color;
      const side = Math.random() < 0.5 ? 'left' : 'right';
      const x = side === 'left' ? Math.random() * 40 : 100 - Math.random() * 40;
      pixel.style.left = x + '%';
      pixel.style.top = '-20px';
      const duration = 3 + Math.random() * 3;
      pixel.style.animation = `fall ${duration}s linear forwards`;
      pixelsContainer.appendChild(pixel);
      activePixels++;
      setTimeout(() => { pixel.remove(); activePixels--; }, duration * 1000);
    }
    setInterval(createPixel, 600);
  </script>
</body>
</html>
